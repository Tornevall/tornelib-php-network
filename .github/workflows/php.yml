name: PHP library tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.0'
            phpunit: '6.5'
            composer: 'v2.2'
          - php: '7.4'
            phpunit: '9.6'
            composer: 'v2'
          - php: '8.2'
            phpunit: '10'
            composer: 'v2'
          - php: '8.4'
            phpunit: '11'
            composer: 'v2'
          - php: '8.5'
            phpunit: '11'
            composer: 'v2'
          - php: '8.6'
            phpunit: '11'
            composer: 'v2'
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:${{ matrix.composer }}, phpunit:${{ matrix.phpunit }}
          extensions: intl
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install library dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run deterministic PHPUnit tests
        run: phpunit --configuration phpunit.xml
      - name: Verify PSL updater against the bundled offline snapshot
        if: matrix.php == '8.4'
        run: |
          php -l bin/update-public-suffix-list.php
          php bin/update-public-suffix-list.php --input-file=resources/public_suffix_list.dat --output-file="$RUNNER_TEMP/psl-rebuilt.dat"
          grep -v '^//' resources/public_suffix_list.dat > "$RUNNER_TEMP/psl-current.rules"
          grep -v '^//' "$RUNNER_TEMP/psl-rebuilt.dat" > "$RUNNER_TEMP/psl-rebuilt.rules"
          diff -u "$RUNNER_TEMP/psl-current.rules" "$RUNNER_TEMP/psl-rebuilt.rules"

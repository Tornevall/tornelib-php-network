name: PHP library tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.0'
            phpunit: '6.5'
            composer: 'v2.2'
          - php: '7.4'
            phpunit: '9.6'
            composer: 'v2'
          - php: '8.2'
            phpunit: '10'
            composer: 'v2'
          - php: '8.4'
            phpunit: '11'
            composer: 'v2'
          - php: '8.5'
            phpunit: '11'
            composer: 'v2'
          - php: '8.6'
            phpunit: '11'
            composer: 'v2'
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:${{ matrix.composer }}, phpunit:${{ matrix.phpunit }}
          extensions: intl
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install library dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run deterministic PHPUnit tests
        run: phpunit --configuration phpunit.xml
      - name: Verify PSL updater against the bundled offline snapshot
        if: matrix.php == '8.4'
        run: |
          php -l bin/update-public-suffix-list.php
          php bin/update-public-suffix-list.php --input-file=resources/public_suffix_list.dat --output-file="$RUNNER_TEMP/psl-rebuilt.dat"
          grep -v '^//' resources/public_suffix_list.dat | grep . > "$RUNNER_TEMP/psl-current.rules"
          grep -v '^//' "$RUNNER_TEMP/psl-rebuilt.dat" | grep . > "$RUNNER_TEMP/psl-rebuilt.rules"
          diff -u "$RUNNER_TEMP/psl-current.rules" "$RUNNER_TEMP/psl-rebuilt.rules"

  publish-network-6-1-5:
    name: Publish network 6.1.5
    needs: phpunit
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'Tornevall/tornelib-php-network'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tested release commit and publish immutable tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=6.1.5
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fqx "## $VERSION - 2026-11-19" CHANGELOG.md
          if grep -Eq '"version"[[:space:]]*:' composer.json; then
            echo "Composer library versions must come from Git tags."
            exit 1
          fi

          # A green matrix must include six genuinely successful PHP jobs.
          php_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.name | startswith("PHP "))] | length')"
          failed_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.name | startswith("PHP ")) | select(.conclusion != "success")] | length')"
          test "$php_jobs" -eq 6
          test "$failed_jobs" -eq 0

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; never recreate or move immutable tags."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag exists without a release. Refusing to retag automatically."
            exit 1
          fi

          awk -v heading="## $VERSION - 2026-11-19" '
            $0 == heading { in_release = 1; next }
            in_release && /^## / { exit }
            in_release { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/network-6.1.5-notes.md"
          test -s "$RUNNER_TEMP/network-6.1.5-notes.md"

          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "tornelib-php-network $VERSION" \
            --notes-file "$RUNNER_TEMP/network-6.1.5-notes.md" \
            --latest

          release_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq '.object.sha')"
          test "$release_commit" = "$GITHUB_SHA"
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft,isPrerelease
